<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Torre de Control · Rampa</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap');

/* ══════════════════════════════════════════════
   TOKENS — paleta de luces de plataforma / pista
   ══════════════════════════════════════════════ */
:root{
  --asphalt:#0B0D10;        /* fondo — asfalto de noche */
  --panel:#15181D;          /* tarjetas / filas del tablero */
  --panel-2:#1C2027;        /* hover / elevado */
  --seam:#050607;           /* línea de bisagra del flap */
  --hairline:rgba(237,239,242,0.08);
  --amber:#FFB020;          /* luz de calle de rodaje — acento primario */
  --amber-dim:rgba(255,176,32,0.14);
  --nav-green:#35D48C;      /* luz de posición de estribor — bien / a tiempo */
  --nav-green-dim:rgba(53,212,140,0.14);
  --beacon-red:#FF4B4B;     /* luz de posición de babor — crítico */
  --beacon-red-dim:rgba(255,75,75,0.14);
  --sky:#4FA8FF;            /* info, uso discreto */
  --sky-dim:rgba(79,168,255,0.14);
  --ink:#EDEFF2;
  --ink-dim:#838B96;
  --ink-faint:#4B5158;
  --radius:14px;
  --font-display:'Space Grotesk',sans-serif;
  --font-mono:'IBM Plex Mono',monospace;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:var(--asphalt);overflow-x:hidden;max-width:100vw}
body{
  font-family:var(--font-display);color:var(--ink);min-height:100vh;
  background-image:
    radial-gradient(ellipse 900px 500px at 15% -10%, rgba(255,176,32,0.05), transparent 60%),
    radial-gradient(ellipse 700px 500px at 100% 10%, rgba(53,212,140,0.04), transparent 60%);
}
@media (prefers-reduced-motion: reduce){ *{animation-duration:.001s !important;transition-duration:.001s !important;} }

.wrap{max-width:900px;margin:0 auto;padding:0 16px 60px}

/* ══ HEADER ══ */
header.top{position:sticky;top:0;z-index:40;background:rgba(11,13,16,0.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--hairline)}
.top-inner{max-width:900px;margin:0 auto;padding:14px 16px 10px;display:flex;flex-direction:column;gap:10px}
.top-row1{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:10px}
.brand-icon{width:34px;height:34px;border-radius:9px;background:linear-gradient(160deg,var(--amber),#e08a00);display:flex;align-items:center;justify-content:center;font-size:16px;box-shadow:0 0 22px rgba(255,176,32,0.28)}
.brand-text{line-height:1.15}
.brand-title{font-weight:700;font-size:15px;letter-spacing:.2px}
.brand-sub{font-family:var(--font-mono);font-size:9.5px;color:var(--ink-dim);letter-spacing:2.5px;text-transform:uppercase}
.live{display:flex;align-items:center;gap:6px;font-family:var(--font-mono);font-size:10px;color:var(--nav-green);letter-spacing:1px}
.live-dot{width:6px;height:6px;border-radius:50%;background:var(--nav-green);box-shadow:0 0 8px var(--nav-green);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.65)}}
.clock{font-family:var(--font-mono);font-size:11px;color:var(--ink-dim)}

.period-row{display:flex;align-items:center;gap:6px}
.period-btn{font-family:var(--font-mono);font-size:10px;letter-spacing:1px;padding:5px 11px;border-radius:20px;background:var(--panel);border:1px solid var(--hairline);color:var(--ink-dim);cursor:pointer;transition:all .15s}
.period-btn.active{background:var(--amber-dim);border-color:rgba(255,176,32,0.5);color:var(--amber)}
.period-btn:hover:not(.active){color:var(--ink)}
.refresh-mini{margin-left:auto;font-family:var(--font-mono);font-size:10px;color:var(--ink-faint);background:none;border:none;cursor:pointer;display:flex;align-items:center;gap:5px}
.refresh-mini:hover{color:var(--ink-dim)}
.refresh-mini.spin .ic{display:inline-block;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* breadcrumb — tira de tablero */
.crumbs{display:flex;align-items:center;gap:0;overflow-x:auto;font-family:var(--font-mono);font-size:11px;letter-spacing:.5px;-webkit-overflow-scrolling:touch;padding-bottom:2px}
.crumbs::-webkit-scrollbar{display:none}
.crumb{color:var(--ink-faint);white-space:nowrap;cursor:pointer;padding:3px 4px;border-radius:4px}
.crumb:last-child{color:var(--amber);cursor:default;font-weight:600}
.crumb:not(:last-child):hover{color:var(--ink-dim);background:var(--panel)}
.crumb-sep{color:var(--ink-faint);padding:0 3px;opacity:.5}

/* ══ VIEW TRANSITION (flip-board style) ══ */
main{perspective:1400px}
.view{transform-style:preserve-3d}
.view.enter{animation:boardIn .32s cubic-bezier(.2,.9,.3,1) both}
.view.leaving{animation:boardOut .18s ease both}
@keyframes boardIn{from{opacity:0;transform:rotateX(8deg) translateY(10px)}to{opacity:1;transform:rotateX(0) translateY(0)}}
@keyframes boardOut{to{opacity:0;transform:rotateX(-8deg) translateY(-6px)}}

/* ══ FLAP TILE — pieza firma ══ */
.flap{
  background:linear-gradient(180deg,var(--panel),var(--panel-2));
  border:1px solid var(--hairline);border-radius:10px;position:relative;overflow:hidden;
  box-shadow:0 1px 0 rgba(255,255,255,0.02) inset, 0 10px 26px rgba(0,0,0,0.35);
}
.flap::after{content:'';position:absolute;left:0;right:0;top:50%;height:1px;background:var(--seam);z-index:2}
.flap-inner{transform-style:preserve-3d;transition:none}
.flap-inner.flipping{animation:flipTile .34s cubic-bezier(.4,0,.2,1)}
@keyframes flipTile{0%{transform:rotateX(0)}48%{transform:rotateX(-90deg)}52%{transform:rotateX(-90deg)}100%{transform:rotateX(0)}}
.flap-txt{font-family:var(--font-mono);font-weight:700;display:block}

/* ══ HERO ══ */
.hero{padding:26px 2px 6px}
.hero-eyebrow{font-family:var(--font-mono);font-size:10px;letter-spacing:3px;color:var(--ink-dim);text-transform:uppercase;margin-bottom:10px}
.hero-flap{padding:22px 22px 18px}
.hero-num{font-size:64px;line-height:.95;color:var(--amber);letter-spacing:-1px}
.hero-label{font-family:var(--font-mono);font-size:11px;color:var(--ink-dim);letter-spacing:1.5px;margin-top:8px}
.hero-sentence{font-size:15px;color:var(--ink);margin-top:6px;line-height:1.5;max-width:60ch}
.hero-sentence b{color:var(--amber);font-weight:600}

.tiles4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.tile{padding:14px 12px 12px;cursor:pointer;transition:transform .15s, border-color .15s}
.tile:hover{transform:translateY(-2px);border-color:rgba(255,176,32,0.3)}
.tile-num{font-size:26px}
.tile-label{font-family:var(--font-mono);font-size:9px;color:var(--ink-dim);letter-spacing:1.2px;text-transform:uppercase;margin-top:6px}
.tile.c-green .tile-num{color:var(--nav-green)}
.tile.c-amber .tile-num{color:var(--amber)}
.tile.c-red .tile-num{color:var(--beacon-red)}
.tile.c-sky .tile-num{color:var(--sky)}

/* narrative insight cards */
.insights{display:flex;flex-direction:column;gap:8px;margin-top:18px}
.insight{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:10px;background:var(--panel);border:1px solid var(--hairline)}
.insight-ic{font-size:16px;flex-shrink:0;margin-top:1px}
.insight-txt{font-size:13px;line-height:1.55;color:var(--ink)}
.insight-txt b{color:var(--amber)}
.insight.warn{border-color:rgba(255,75,75,0.28);background:rgba(255,75,75,0.04)}
.insight.warn .insight-txt b{color:var(--beacon-red)}

/* ══ SECTION LABEL ══ */
.section-label{font-family:var(--font-mono);font-size:10px;letter-spacing:3px;color:var(--ink-faint);text-transform:uppercase;margin:26px 2px 10px;display:flex;align-items:center;gap:10px}
.section-label::after{content:'';flex:1;height:1px;background:var(--hairline)}

/* ══ CHAPTER GRID (home rows) ══ */
.board{display:flex;flex-direction:column;gap:1px;border-radius:var(--radius);overflow:hidden;border:1px solid var(--hairline)}
.brow{display:flex;align-items:center;gap:12px;background:var(--panel);padding:14px 16px;cursor:pointer;transition:background .12s;position:relative}
.brow:hover{background:var(--panel-2)}
.brow:not(:last-child){border-bottom:1px solid var(--hairline)}
.brow-ic{font-size:18px;width:26px;text-align:center;flex-shrink:0}
.brow-main{flex:1;min-width:0}
.brow-title{font-size:14px;font-weight:600}
.brow-sub{font-family:var(--font-mono);font-size:10.5px;color:var(--ink-dim);margin-top:2px}
.brow-val{font-family:var(--font-mono);font-weight:700;font-size:17px;color:var(--amber);flex-shrink:0}
.brow-chev{color:var(--ink-faint);font-size:14px;flex-shrink:0}
.brow.crit .brow-val{color:var(--beacon-red)}

/* ══ FILTER CHIPS / SEARCH ══ */
.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chip{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.5px;padding:6px 13px;border-radius:20px;background:var(--panel);border:1px solid var(--hairline);color:var(--ink-dim);cursor:pointer;white-space:nowrap;transition:all .15s}
.chip.active{background:var(--amber-dim);border-color:rgba(255,176,32,0.5);color:var(--amber)}
.search-in{flex:1;min-width:140px;background:var(--panel);border:1px solid var(--hairline);border-radius:20px;padding:6px 14px;color:var(--ink);font-family:var(--font-mono);font-size:11px;outline:none}
.search-in:focus{border-color:rgba(255,176,32,0.4)}
.search-in::placeholder{color:var(--ink-faint)}

/* ══ FLIGHT ROW (list) ══ */
.frow{display:grid;grid-template-columns:1.5fr 1fr .8fr 1.2fr .9fr;gap:10px;align-items:center;background:var(--panel);padding:13px 16px;cursor:pointer;transition:background .12s}
.frow:hover{background:var(--panel-2)}
.frow:not(:last-child){border-bottom:1px solid var(--hairline)}
.frow-flight{font-weight:600;font-size:13.5px}
.frow-flight .code{font-family:var(--font-mono);color:var(--amber);margin-right:5px}
.frow-insp{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-dim);overflow:hidden}
.dot-insp{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.frow-time{font-family:var(--font-mono);font-size:11px;color:var(--ink-dim)}
.badge{font-family:var(--font-mono);font-size:9px;font-weight:700;padding:2px 7px;border-radius:5px;letter-spacing:.5px}
.b-turn{background:var(--sky-dim);color:var(--sky)}
.b-arr{background:var(--nav-green-dim);color:var(--nav-green)}
.b-dep{background:var(--amber-dim);color:var(--amber)}
.prog-wrap{display:flex;align-items:center;gap:6px}
.prog-bg{flex:1;height:4px;border-radius:4px;background:rgba(255,255,255,0.06);overflow:hidden}
.prog-fill{height:100%;border-radius:4px;background:var(--amber)}
.prog-fill.done{background:var(--nav-green)}
.prog-pct{font-family:var(--font-mono);font-size:10px;color:var(--ink-dim);flex-shrink:0}
@media(max-width:680px){.frow{grid-template-columns:1.6fr .9fr 1fr}.frow-time,.frow>.prog-wrap{display:none}}

/* ══ RANK ROW ══ */
.rrow{display:flex;align-items:center;gap:12px;background:var(--panel);padding:13px 16px;cursor:pointer}
.rrow:not(:last-child){border-bottom:1px solid var(--hairline)}
.rrow:hover{background:var(--panel-2)}
.rpos{font-family:var(--font-mono);font-weight:700;font-size:12px;width:20px;color:var(--ink-faint);text-align:center}
.rpos.p1{color:var(--amber)}.rpos.p2{color:var(--ink-dim)}.rpos.p3{color:#c98b4f}
.rname{flex:1;min-width:0;font-size:13.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rmeta{font-family:var(--font-mono);font-size:10px;color:var(--ink-dim)}
.rbar-wrap{width:80px;flex-shrink:0}
.rbar-bg{height:4px;border-radius:4px;background:rgba(255,255,255,0.06);overflow:hidden}
.rbar-fill{height:100%;border-radius:4px}
.rval{font-family:var(--font-mono);font-weight:700;font-size:13px;width:44px;text-align:right;flex-shrink:0}

/* ══ ALERT ROW ══ */
.arow{display:flex;gap:12px;align-items:flex-start;background:var(--panel);padding:14px 16px;cursor:pointer;border-left:3px solid transparent}
.arow:not(:last-child){border-bottom:1px solid var(--hairline)}
.arow:hover{background:var(--panel-2)}
.arow.crit{border-left-color:var(--beacon-red)}
.arow.warn{border-left-color:var(--amber)}
.aic{font-size:17px;flex-shrink:0;margin-top:1px}
.abody{flex:1;min-width:0}
.atitle{font-size:13.5px;font-weight:600}
.adesc{font-size:12px;color:var(--ink-dim);margin-top:3px;line-height:1.45}
.aval{font-family:var(--font-mono);font-weight:700;font-size:16px;flex-shrink:0}
.aval.crit{color:var(--beacon-red)}.aval.warn{color:var(--amber)}

/* ══ EMPTY / LOADING ══ */
.empty-board{padding:44px 20px;text-align:center;color:var(--ink-faint);font-family:var(--font-mono);font-size:12px;letter-spacing:1px;background:var(--panel);border-radius:var(--radius);border:1px dashed var(--hairline)}
.skel-row{background:var(--panel);padding:14px 16px;display:flex;gap:12px;align-items:center}
.skel-row:not(:last-child){border-bottom:1px solid var(--hairline)}
.skel{height:12px;border-radius:4px;background:linear-gradient(90deg,rgba(255,255,255,0.04),rgba(255,255,255,0.09),rgba(255,255,255,0.04));background-size:200% 100%;animation:shimmer 1.3s ease-in-out infinite}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}

/* ══ FLIGHT DETAIL ══ */
.fd-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.fd-title{font-size:22px;font-weight:700}
.fd-meta{font-family:var(--font-mono);font-size:11px;color:var(--ink-dim);margin-top:4px}
.fd-status{font-family:var(--font-mono);font-size:10px;font-weight:700;letter-spacing:1px;padding:5px 12px;border-radius:20px}
.fd-status.done{background:var(--nav-green-dim);color:var(--nav-green)}
.fd-status.live{background:var(--amber-dim);color:var(--amber)}
.fd-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-bottom:22px}
.fd-kpi{padding:12px 13px}
.fd-kpi-val{font-size:20px}
.fd-kpi-lbl{font-family:var(--font-mono);font-size:8.5px;color:var(--ink-dim);letter-spacing:1px;text-transform:uppercase;margin-top:5px}

.timeline{display:flex;flex-direction:column}
.tl-item{display:flex;gap:12px;padding:10px 4px;position:relative}
.tl-line{position:absolute;left:15px;top:26px;bottom:-4px;width:1px;background:var(--hairline)}
.tl-item:last-child .tl-line{display:none}
.tl-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;margin-top:4px;z-index:1;background:var(--ink-faint)}
.tl-dot.ok{background:var(--nav-green);box-shadow:0 0 6px var(--nav-green)}
.tl-dot.warn{background:var(--amber);box-shadow:0 0 6px var(--amber)}
.tl-dot.late{background:var(--beacon-red);box-shadow:0 0 6px var(--beacon-red)}
.tl-body{flex:1;display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.tl-name{font-size:13px}
.tl-time{font-family:var(--font-mono);font-size:11px;color:var(--ink-dim);flex-shrink:0}
.tl-delta{font-family:var(--font-mono);font-size:10px;flex-shrink:0}
.tl-delta.ok{color:var(--nav-green)}.tl-delta.warn{color:var(--amber)}.tl-delta.late{color:var(--beacon-red)}

.insp-strip{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--hairline);border-radius:12px;padding:12px 14px;margin-bottom:18px}
.insp-av{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#0B0D10;flex-shrink:0}
.insp-name{font-size:14px;font-weight:600}
.insp-role{font-family:var(--font-mono);font-size:10px;color:var(--ink-dim)}
.photo-cta{margin-left:auto;font-family:var(--font-mono);font-size:10.5px;font-weight:700;padding:7px 13px;border-radius:20px;background:var(--amber-dim);border:1px solid rgba(255,176,32,0.4);color:var(--amber);cursor:pointer;white-space:nowrap}
.photo-cta:hover{background:rgba(255,176,32,0.24)}
.photo-cta:disabled{opacity:.35;cursor:default}

/* ══ TREND SPARK ══ */
.spark-wrap{background:var(--panel);border:1px solid var(--hairline);border-radius:var(--radius);padding:18px 14px 10px}
.spark-svg{width:100%;height:120px;display:block}
.spark-bar{cursor:pointer;transition:opacity .12s}
.spark-bar:hover{opacity:.75}
.spark-labels{display:flex;justify-content:space-between;font-family:var(--font-mono);font-size:8.5px;color:var(--ink-faint);margin-top:4px;padding:0 2px}

/* ══ BACK CHIP ══ */
.back-btn{display:inline-flex;align-items:center;gap:5px;font-family:var(--font-mono);font-size:11px;color:var(--ink-dim);background:none;border:none;cursor:pointer;margin-bottom:14px}
.back-btn:hover{color:var(--amber)}

/* ══ LIGHTBOX (reuse) ══ */
.lbx{position:fixed;inset:0;z-index:900;background:rgba(5,6,7,0.96);backdrop-filter:blur(16px);display:flex;flex-direction:column;animation:fadeIn .2s ease}
.lbx.hidden{display:none}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.lbx-head{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--hairline);gap:12px;flex-wrap:wrap}
.lbx-badge{font-family:var(--font-mono);font-size:11px;padding:4px 11px;border-radius:20px;background:var(--amber-dim);color:var(--amber);border:1px solid rgba(255,176,32,0.35)}
.lbx-title{font-size:14px;font-weight:700}
.lbx-sub{font-family:var(--font-mono);font-size:10px;color:var(--ink-dim)}
.lbx-close{width:32px;height:32px;border-radius:8px;background:var(--beacon-red-dim);border:1px solid rgba(255,75,75,0.3);color:#ffb3b3;cursor:pointer;font-size:14px}
.lbx-main{flex:1;display:flex;min-height:0}
.lbx-strip{width:110px;flex-shrink:0;overflow-y:auto;background:rgba(0,0,0,0.3);border-right:1px solid var(--hairline);padding:8px 6px;display:flex;flex-direction:column;gap:5px}
.lbx-thumb{border-radius:8px;overflow:hidden;cursor:pointer;border:2px solid transparent;position:relative;background:var(--panel)}
.lbx-thumb.active{border-color:var(--amber)}
.lbx-thumb img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}
.lbx-thumb .tlabel{position:absolute;bottom:0;left:0;right:0;background:rgba(0,0,0,0.8);color:var(--ink);font-size:8px;padding:3px 4px;font-family:var(--font-mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lbx-noph{aspect-ratio:4/3;display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--ink-faint)}
.lbx-stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;min-width:0}
.lbx-img{max-width:100%;max-height:70vh;object-fit:contain;border-radius:10px;box-shadow:0 20px 50px rgba(0,0,0,0.6)}
.lbx-nav{position:absolute;top:50%;transform:translateY(-50%);width:38px;height:38px;border-radius:50%;background:var(--panel);border:1px solid var(--hairline);color:var(--ink);font-size:17px;cursor:pointer}
.lbx-nav:disabled{opacity:.2}
.lbx-nav.prev{left:14px}.lbx-nav.next{right:14px}
.lbx-cap{margin-top:12px;text-align:center;font-size:13px;color:var(--ink-dim);font-family:var(--font-mono)}
.lbx-spin{width:34px;height:34px;border-radius:50%;border:3px solid rgba(255,176,32,0.2);border-top-color:var(--amber);animation:spin .7s linear infinite}

::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-thumb{background:rgba(255,176,32,0.25);border-radius:4px}
</style>
</head>
<body>

<header class="top">
  <div class="top-inner">
    <div class="top-row1">
      <div class="brand">
        <div class="brand-icon">✈️</div>
        <div class="brand-text">
          <div class="brand-title">Torre de Control</div>
          <div class="brand-sub">Rampa · Turnaround Check</div>
        </div>
      </div>
      <div style="display:flex;align-items:center;gap:14px;">
        <div class="clock" id="clock">–</div>

<script>
/* ══════════════════════════════════════════════════════════
   CONFIG — mismos endpoints Apps Script que ya usás

const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwbN3f4_EifWj5L_JvtMYi31wof4kKDPigE-NG3SaVXum2ZCF9VwKO66gnn1ceYXNYxsw/exec';
const SHEETS = [
  {sheetName:'TURN',        flightType:'TURN'},
  {sheetName:'RON_Llegada', flightType:'RON-ARRIVAL'},
  {sheetName:'RON_Salida',  flightType:'RON-DEPARTURE'},
];

/* ══ CACHÉ LOCAL — carga progresiva: hoy primero, histórico bajo demanda ══ */
const CACHE_KEY='torre_cache_v1';
const FULL_SYNC_MAX_AGE = 6*60*60*1000;
function loadCache(){ try{ const r=localStorage.getItem(CACHE_KEY); return r?JSON.parse(r):{byKey:{},lastFullSync:0}; }catch(e){ return {byKey:{},lastFullSync:0}; } }
function saveCache(){ try{ localStorage.setItem(CACHE_KEY, JSON.stringify(cache)); }catch(e){} }
var cache = loadCache();

/* ══════════════════════════════════════════════════════════
   SLA — desde Beacon OFF (mismos umbrales operativos)
   ══════════════════════════════════════════════════════════ */
const SLA_FROM_BEACON = {
  'Planta Eléctrica':{warn:7,crit:12,icon:'⚡',label:'Planta Eléctrica'},
  'Aire Acondicionado':{warn:7,crit:12,icon:'❄️',label:'Aire Acondicionado'},
  'Banda':{warn:10,crit:15,icon:'🛞',label:'Banda'},
  'Escalera':{warn:10,crit:15,icon:'🪜',label:'Escalera'},
  'Inicia Descarga Equipaje':{warn:15,crit:22,icon:'🧳',label:'1ra Maleta'},
  'Inicia Descarga Carga':{warn:12,crit:18,icon:'📦',label:'Inicio Desc. Carga'},
  'Waste & Water':{warn:20,crit:30,icon:'🚰',label:'Waste & Water'},
  'Sube Limpieza':{warn:25,crit:35,icon:'🧹',label:'Sube Limpieza'},
  'Baja Limpieza':{warn:45,crit:55,icon:'🧹',label:'Baja Limpieza'},
  'Inicia Carga Maleta':{warn:40,crit:50,icon:'🏷️',label:'Inicio Carga Maleta'},
  'Inicia Carga de Equipaje':{warn:40,crit:50,icon:'🏷️',label:'Inicio Carga Equipaje'},
  'Cierre Bines':{warn:55,crit:65,icon:'🔒',label:'Cierre Bines'},
  'Towbar':{warn:58,crit:68,icon:'🔗',label:'Towbar'},
  'Push Back':{warn:60,crit:75,icon:'🚜',label:'Push Back'},
  'En el Aire':{warn:75,crit:90,icon:'🛫',label:'En el Aire'},
};
const CP_COLS_TURN=['Briefing','Inicio FOD','Beacon OFF','Planta Eléctrica','Aire Acondicionado','Banda','Escalera','Inicia Descarga Carga','Waste & Water','Finaliza Descarga Carga','Inicia Descarga Equipaje','Finaliza Descarga Equipaje','Sube Limpieza','Baja Limpieza','2do FOD','Último Viaje Carreta','Inicia Carga Maleta','Última Maleta','Towbar','Cierre Bines','Push Back','3er FOD','En el Aire'];
const CP_COLS_RON_ARRIVAL=['Briefing','FOD','Beacon OFF','Planta Eléctrica','Aire Acondicionado','Banda','Escalera','Inicia Descarga Equipaje','Finaliza Descarga Equipaje','Waste & Water','Sube Limpieza','Baja Limpieza','2do FOD','Último Viaje Carreta','Cierre Bines','Towbar'];
const CP_COLS_RON_DEPARTURE=['Briefing','FOD','Avión en Posición','Planta Eléctrica','Aire Acondicionado','Banda','Escalera','Inicia Carga de Equipaje','Waste & Water','2do FOD','Finaliza Carga Equipaje','Inicia carga de Carga','Finaliza carga de Carga','Towbar','Cierre Bines','Push Back','3er FOD'];
function getCpCols(t){return t==='RON-ARRIVAL'?CP_COLS_RON_ARRIVAL:t==='RON-DEPARTURE'?CP_COLS_RON_DEPARTURE:CP_COLS_TURN;}

const INSPECTOR_PALETTE=['#FFB020','#35D48C','#4FA8FF','#FF4B4B','#c98b4f','#8FD6FF','#FFD166','#7EE787'];
var inspColorMap={},inspColorN=0;
function inspColor(name){ if(!name) return INSPECTOR_PALETTE[0]; if(inspColorMap[name]===undefined){inspColorMap[name]=inspColorN%INSPECTOR_PALETTE.length;inspColorN++;} return INSPECTOR_PALETTE[inspColorMap[name]]; }

/* ══════════════════════════════════════════════════════════
   JSONP + NORMALIZE (misma lógica ya validada contra el GAS)
   ══════════════════════════════════════════════════════════ */
function jsonpFetch(id,url,timeoutMs,onData,onFail){
  const old=document.getElementById(id); if(old) old.parentNode.removeChild(old);
  const cbName='cb_'+id.replace(/[^a-z0-9]/gi,'_')+'_'+Date.now();
  const script=document.createElement('script'); script.id=id;
  let fired=false;
  const timer=setTimeout(()=>{ if(!fired){fired=true;cleanup();onFail('timeout');} },timeoutMs);
  function cleanup(){ if(window[cbName]) delete window[cbName]; if(script.parentNode) script.parentNode.removeChild(script); }
  window[cbName]=data=>{ if(fired) return; fired=true; clearTimeout(timer); cleanup(); onData(data); };
  script.onerror=()=>{ if(fired) return; fired=true; clearTimeout(timer); cleanup(); onFail('script-error'); };
  document.body.appendChild(script);
  script.src=url+(url.indexOf('?')>=0?'&':'?')+'callback='+cbName;
}

function normalizeReport(r,_sheetType){
  function get(){for(let i=0;i<arguments.length;i++){const v=r[arguments[i]];if(v!==undefined&&v!==null&&String(v).trim()!=='')return v;}return null;}
  const flightType=get('Tipo','flightType')||_sheetType||'TURN';
  const flightKey=get('Flight Key','flightKey')||'';
  const airlineCode=get('Código Aerolínea','airline')||'–';
  const airlineName=get('Aerolínea','airlineName')||'–';
  const flightNumber=get('Vuelo','flightNumber')||'–';
  const flightTs=get('Fecha/Hora','flightTimestamp')||'';
  const inspector=get('Inspector','inspector')||'–';
  const aeropuerto=get('Aeropuerto','aeropuerto')||'–';
  const itemsDone=parseInt(get('Items Completados','itemsCompletados')||0);
  const cpCols=getCpCols(flightType);
  const itemsTotal=parseInt(get('Items Totales','itemsTotales')||cpCols.length);
  let progress=0;
  const tasaRaw=get('Tasa Completitud (%)','progress');
  if(tasaRaw!==null){ const p=parseFloat(String(tasaRaw).replace('%','')); if(!isNaN(p)) progress=p; }
  else if(itemsTotal>0) progress=Math.round((itemsDone/itemsTotal)*100);
  let status='En Proceso';
  const statusRaw=get('Estatus','status')||'';
  if(/complet|done|cerrad/i.test(statusRaw)) status='Completado';
  else if(!statusRaw) status = progress>=100?'Completado':'En Proceso';

  let photoCount=0; const checkpoints=[];
  if(Array.isArray(r.checkpoints)){
    r.checkpoints.forEach(cp=>{ if(cp.photoUrl||cp.thumbUrl) photoCount++; checkpoints.push({label:cp.label,timestamp:cp.timestamp,photoUrl:cp.photoUrl||null,thumbUrl:cp.thumbUrl||null}); });
  } else {
    cpCols.forEach(label=>{
      const ts=get(label); if(!ts) return;
      const parts=String(ts).split(' | ');
      const photoUrl=parts.length>1?parts[1].trim():'';
      let thumbUrl='';
      if(photoUrl && photoUrl.indexOf('drive.google.com')>=0){
        const m=photoUrl.match(/\/d\/([^\/\?]+)/);
        if(m) thumbUrl='https://drive.google.com/thumbnail?id='+m[1]+'&sz=w400';
        photoCount++;
      }
      checkpoints.push({label,timestamp:parts[0].trim(),photoUrl:photoUrl||null,thumbUrl:thumbUrl||null});
    });
  }
  const gasPhotoCount=parseInt(get('photoCount')||0); if(gasPhotoCount>photoCount) photoCount=gasPhotoCount;

  const uniqueKey=flightKey?(_sheetType+'_'+flightKey):(_sheetType+'_'+flightNumber+'_'+flightTs);
  return{ flightKey:uniqueKey, flightKeyRaw:flightKey, airline:airlineCode, airlineName, flightNumber, flightType,
    flightTimestamp:flightTs, inspector, aeropuerto, progress, status, checkpoints, photoCount, incident:r.incident||null };
}

function loadSheet(sheetName,flightType,scope,done){
  const tag='jst_'+sheetName.replace(/[^a-z0-9]/gi,'_')+'_'+scope;
  const url1=SCRIPT_URL+'?action=getHistory&sheet='+encodeURIComponent(sheetName)+'&scope='+scope;
  jsonpFetch(tag,url1,9000,
    data=>{ if(data&&data.success&&Array.isArray(data.reports)) done(data.reports,flightType); else attempt2(); },
    ()=>attempt2());
  function attempt2(){
    const url2=SCRIPT_URL+'?action=getAllHistory&scope='+scope;
    jsonpFetch(tag+'_2',url2,9000,
      data=>{
        if(data&&data.success&&Array.isArray(data.reports)){
          let reps=data.reports; if(flightType!=='TURN') reps=reps.filter(r=>(r['Tipo']||r['flightType']||'')===flightType);
          done(reps,flightType);
        } else done([],flightType);
      },()=>done([],flightType));
  }
}

function loadScope(scope, cb){
  let results=[], pending=SHEETS.length;
  SHEETS.forEach(s=>{
    loadSheet(s.sheetName,s.flightType,scope,(reports,flightType)=>{
      reports.forEach(raw=>{ const norm=normalizeReport(raw,flightType); if(norm.flightKey) cache.byKey[norm.flightKey]=norm; });
      pending--; if(pending===0){ saveCache(); cb(); }
    });
  });
}

/* ══════════════════════════════════════════════════════════
   ESTADO / NAVEGACIÓN — pila de breadcrumbs
   ══════════════════════════════════════════════════════════ */
var state = { period:'today', stack:[{view:'home',label:'HOY',params:{}}] };
var booted=false;

function periodLabel(p){ return p==='today'?'HOY':p==='week'?'7 DÍAS':'TODO'; }

function setPeriod(p, el){
  state.period=p;
  document.querySelectorAll('.period-btn').forEach(b=>b.classList.remove('active'));
  if(el) el.classList.add('active');
  state.stack=[{view:'home',label:periodLabel(p),params:{}}];
  ensureData(p, render);
}

function ensureData(period, cb){
  if(period==='today'){ cb(); return; }
  const stale = !cache.lastFullSync || (Date.now()-cache.lastFullSync>FULL_SYNC_MAX_AGE);
  if(!stale){ cb(); return; }
  spinRefresh(true);
  loadScope('all', ()=>{ cache.lastFullSync=Date.now(); saveCache(); spinRefresh(false); cb(); });
}

function manualRefresh(){
  spinRefresh(true);
  loadScope(state.period==='today'?'today':'all', ()=>{
    if(state.period!=='today') cache.lastFullSync=Date.now();
    saveCache(); spinRefresh(false); render();
  });
}
function spinRefresh(on){ document.getElementById('refreshBtn').classList.toggle('spin',on); }

function goTo(view,label,params){
  state.stack.push({view,label,params:params||{}});
  render();
}
function goToCrumb(idx){
  state.stack=state.stack.slice(0,idx+1);
  render();
}
function goBack(){ if(state.stack.length>1){ state.stack.pop(); render(); } }

function renderCrumbs(){
  const el=document.getElementById('crumbs');
  el.innerHTML=state.stack.map((c,i)=>
    (i>0?'<span class="crumb-sep">›</span>':'')+
    '<span class="crumb" onclick="goToCrumb('+i+')">'+c.label+'</span>'
  ).join('');
}

/* ══ DATA HELPERS ══ */
function parseFlightDate(r){
  try{
    let ts=r.flightTimestamp||''; if(!ts) return 0;
    let d=new Date(ts); if(!isNaN(d.getTime())) return d.getTime();
    const parts=ts.match(/(\d+)\/(\d+)\/(\d+)\s+(\d+):(\d+):?(\d*)/);
    if(parts) return new Date(+parts[3],+parts[1]-1,+parts[2],+parts[4],+parts[5],+(parts[6]||0)).getTime();
    return 0;
  }catch(e){ return 0; }
}
function allCached(){ return Object.values(cache.byKey); }
function getShift(ts){ if(!ts) return null; const h=new Date(ts).getHours(); if(h>=5&&h<12) return 'morning'; if(h>=12&&h<18) return 'afternoon'; return 'night'; }
function shiftLabel(s){ return s==='morning'?'mañana':s==='afternoon'?'tarde':'noche'; }

function filteredByPeriod(){
  const now=new Date();
  return allCached().filter(r=>{
    const ts=parseFlightDate(r); if(!ts) return false;
    const d=new Date(ts);
    if(state.period==='today') return d.toDateString()===now.toDateString();
    if(state.period==='week'){ const w=new Date(now); w.setDate(w.getDate()-7); return d>=w; }
    return true;
  });
}

function cpTs(r,label){ const f=(r.checkpoints||[]).find(c=>c.label===label); return f?f.timestamp:null; }
function normTs(ts){ if(!ts) return null; const s=String(ts).split('\n')[0].trim(); if(/^\d{1,2}:\d{2}/.test(s)) return new Date().toISOString().slice(0,10)+'T'+s; return s; }
function minFrom(a,b){ if(!a||!b) return null; const da=new Date(normTs(a)),db=new Date(normTs(b)); const d=(db-da)/60000; return (isNaN(d)||d<0)?null:+d.toFixed(1); }
function flightLabel(r){ return (r.airlineName||r.airline||'–')+' '+r.flightNumber; }

function buildAlerts(reports){
  const alerts=[];
  reports.forEach(r=>{
    const beacon=cpTs(r,'Beacon OFF'); if(!beacon) return;
    Object.entries(SLA_FROM_BEACON).forEach(([cpLabel,sla])=>{
      const t=cpTs(r,cpLabel); if(!t) return;
      const m=minFrom(beacon,t); if(m===null) return;
      if(m>sla.crit) alerts.push({type:'critical',icon:sla.icon,title:sla.label+' tardío — '+flightLabel(r),desc:r.inspector+': registrado a los '+m+' min desde Beacon OFF (límite '+sla.crit+'m)',value:m,unit:'min',report:r});
      else if(m>sla.warn) alerts.push({type:'warning',icon:sla.icon,title:sla.label+' al límite — '+flightLabel(r),desc:r.inspector+': '+m+' min desde Beacon OFF (límite '+sla.warn+'m)',value:m,unit:'min',report:r});
    });
  });
  reports.filter(r=>r.status==='En Proceso').forEach(r=>{
    const ts=parseFlightDate(r); if(!ts) return;
    const minOpen=(Date.now()-ts)/60000;
    if(minOpen>=240) alerts.push({type:'critical',icon:'⏳',title:'Reporte sin cerrar — '+flightLabel(r),desc:r.inspector+' lleva '+Math.round(minOpen)+' min abierto ('+Math.round(r.progress||0)+'% avance)',value:Math.round(minOpen),unit:'min',report:r});
    else if(minOpen>=120) alerts.push({type:'warning',icon:'⚠️',title:'Reporte prolongado — '+flightLabel(r),desc:r.inspector+': '+Math.round(minOpen)+' min abierto ('+Math.round(r.progress||0)+'% avance)',value:Math.round(minOpen),unit:'min',report:r});
  });
  reports.filter(r=>r.incident).forEach(r=>{
    const crit=/alta|high|críti/i.test(r.incident.severity||'');
    alerts.push({type:crit?'critical':'warning',icon:'🔴',title:'Incidente — '+flightLabel(r),desc:(r.incident.description||'Sin descripción')+'. Reportado por '+r.inspector,value:r.incident.severity||'–',unit:'severidad',report:r});
  });
  alerts.sort((a,b)=> (a.type==='critical'?0:1)-(b.type==='critical'?0:1));
  return alerts;
}

function computeInsights(reports, alerts){
  const out=[];
  if(!reports.length) return out;
  const byA={}; reports.forEach(r=>{ const n=r.airlineName||r.airline||'–'; if(!byA[n]) byA[n]={total:0,done:0}; byA[n].total++; if(r.status==='Completado') byA[n].done++; });
  const topA=Object.entries(byA).sort((a,b)=>b[1].total-a[1].total)[0];
  if(topA){ const pct=Math.round(topA[1].done/topA[1].total*100); out.push({icon:'✈️',html:'<b>'+topA[0]+'</b> lidera el tráfico con '+topA[1].total+' vuelo(s) — '+pct+'% completados.'}); }

  const byI={}; reports.forEach(r=>{ const n=r.inspector||'–'; if(!byI[n]) byI[n]={total:0,done:0}; byI[n].total++; if(r.status==='Completado') byI[n].done++; });
  const topI=Object.entries(byI).filter(([,v])=>v.total>=2).sort((a,b)=> (b[1].done/b[1].total)-(a[1].done/a[1].total) || b[1].total-a[1].total)[0];
  if(topI){ const pct=Math.round(topI[1].done/topI[1].total*100); out.push({icon:'👤',html:'<b>'+topI[0]+'</b> lleva '+topI[1].total+' reportes con '+pct+'% de completitud.'}); }

  const shifts={morning:0,afternoon:0,night:0}; reports.forEach(r=>{ const s=getShift(parseFlightDate(r)); if(s) shifts[s]++; });
  const topS=Object.entries(shifts).sort((a,b)=>b[1]-a[1])[0];
  if(topS && topS[1]>0){ const pct=Math.round(topS[1]/reports.length*100); out.push({icon:'🕐',html:'El turno de la <b>'+shiftLabel(topS[0])+'</b> concentra el mayor movimiento: '+topS[1]+' vuelos ('+pct+'%).'}); }

  const crit=alerts.filter(a=>a.type==='critical').length;
  if(crit>0) out.push({icon:'🚨',warn:true,html:'<b>'+crit+' alerta(s) crítica(s)</b> requieren atención inmediata.'});
  else out.push({icon:'✅',html:'Sin alertas críticas — la operación va <b>en verde</b>.'});
  return out;
}

/* ══ FLAP HELPERS ══ */
function flapTile(id,val,cls,extraAttrs){
  return '<div class="flap '+(cls||'')+'" '+(extraAttrs||'')+'><div class="flap-inner" id="'+id+'"><span class="flap-txt" data-val="">'+val+'</span></div></div>';
}
function setFlap(id,val){
  const inner=document.getElementById(id); if(!inner) return;
  const span=inner.querySelector('.flap-txt');
  if(span.dataset.val===String(val)){ span.textContent=val; span.dataset.val=String(val); return; }
  const first = span.dataset.val==='';
  span.dataset.val=String(val);
  if(first){ span.textContent=val; return; }
  inner.classList.remove('flipping'); void inner.offsetWidth; inner.classList.add('flipping');
  setTimeout(()=>{ span.textContent=val; },160);
}

/* ══════════════════════════════════════════════════════════
   RENDER — router principal
   ══════════════════════════════════════════════════════════ */
function render(){
  renderCrumbs();
  const top=state.stack[state.stack.length-1];
  const main=document.getElementById('main');
  const wrap=document.createElement('div'); wrap.className='view enter';
  main.innerHTML=''; main.appendChild(wrap);

  const reports=filteredByPeriod();
  const alerts=buildAlerts(reports);

  if(top.view==='home') renderHome(wrap,reports,alerts);
  else if(top.view==='flights') renderFlights(wrap,reports,top.params);
  else if(top.view==='alerts') renderAlerts(wrap,alerts);
  else if(top.view==='team') renderTeam(wrap,reports);
  else if(top.view==='airlines') renderAirlines(wrap,reports);
  else if(top.view==='stations') renderStations(wrap,reports);
  else if(top.view==='trend') renderTrend(wrap);
  else if(top.view==='entity-flights') renderFlights(wrap,reports,top.params);
  else if(top.view==='flight') renderFlightDetail(wrap,top.params.key);
  else if(top.view==='day') renderDayFlights(wrap,top.params.dateKey);
}

function backBtn(){ return '<button class="back-btn" onclick="goBack()">‹ volver</button>'; }

/* ══ HOME ══ */
function renderHome(wrap,reports,alerts){
  const total=reports.length;
  const done=reports.filter(r=>r.status==='Completado').length;
  const pending=total-done;
  const critAlerts=alerts.filter(a=>a.type==='critical').length;
  const warnAlerts=alerts.filter(a=>a.type==='warning').length;
  const team=new Set(reports.map(r=>r.inspector).filter(Boolean)).size;
  const insights=computeInsights(reports,alerts);

  wrap.innerHTML = `
    <div class="hero">
      <div class="hero-eyebrow">${periodLabel(state.period)} · OPERACIÓN GENERAL</div>
      <div class="flap hero-flap">
        <div class="hero-num" id="flapHero">${total}</div>
        <div class="hero-label">VUELOS ${state.period==='today'?'HOY':'EN EL PERÍODO'}</div>
      </div>
      ${insights.length?`<div class="hero-sentence">${insights[0].html}</div>`:''}

      <div class="tiles4">
        <div class="flap tile c-green" onclick="goTo('flights','${periodLabel(state.period)} · Completados',{filter:'done'})">
          <div class="tile-num" id="tileDone">${done}</div><div class="tile-label">Completados</div>
        </div>
        <div class="flap tile c-amber" onclick="goTo('flights','${periodLabel(state.period)} · En proceso',{filter:'pending'})">
          <div class="tile-num" id="tilePending">${pending}</div><div class="tile-label">En proceso</div>
        </div>
        <div class="flap tile ${critAlerts>0?'c-red':'c-green'}" onclick="goTo('alerts','${periodLabel(state.period)} · Alertas',{})">
          <div class="tile-num" id="tileAlerts">${critAlerts+warnAlerts}</div><div class="tile-label">Alertas</div>
        </div>
        <div class="flap tile c-sky" onclick="goTo('team','${periodLabel(state.period)} · Equipo',{})">
          <div class="tile-num" id="tileTeam">${team}</div><div class="tile-label">Inspectores</div>
        </div>
      </div>

      <div class="insights">
        ${insights.map(i=>`<div class="insight ${i.warn?'warn':''}"><div class="insight-ic">${i.icon}</div><div class="insight-txt">${i.html}</div></div>`).join('')}
      </div>
    </div>

    <div class="section-label">explorar</div>
    <div class="board">
      ${brow('✈️','Vuelos','todos los reportes de rampa',total,()=>{},'flights')}
      ${brow('🚨','Alertas','tiempos y checkpoints en riesgo',critAlerts+warnAlerts,()=>{},'alerts', critAlerts>0)}
      ${brow('👥','Equipo','ranking de inspectores',team,()=>{},'team')}
      ${brow('🏷️','Aerolíneas','tráfico y completitud por aerolínea',new Set(reports.map(r=>r.airlineName)).size,()=>{},'airlines')}
      ${brow('🏢','Estaciones','desglose por estación',new Set(reports.map(r=>r.aeropuerto)).size,()=>{},'stations')}
      ${brow('📈','Tendencia','actividad de los últimos 14 días','14d',()=>{},'trend')}
    </div>
  `;
  // brow() builds onclick as string via data attrs — wire below
  wrap.querySelectorAll('.brow').forEach(el=>{
    el.addEventListener('click',()=>{
      const view=el.dataset.view;
      const label=el.dataset.label;
      goTo(view,label,{});
    });
  });
}
function brow(icon,title,sub,val,_unused,view,crit){
  return `<div class="brow ${crit?'crit':''}" data-view="${view}" data-label="${title}">
    <div class="brow-ic">${icon}</div>
    <div class="brow-main"><div class="brow-title">${title}</div><div class="brow-sub">${sub}</div></div>
    <div class="brow-val">${val}</div><div class="brow-chev">›</div>
  </div>`;
}

/* ══ VUELOS ══ */
var flightsFilterType='all', flightsSearch='';
function renderFlights(wrap,reports,params){
  let list=reports;
  if(params && params.filter==='done') list=list.filter(r=>r.status==='Completado');
  if(params && params.filter==='pending') list=list.filter(r=>r.status!=='Completado');
  if(params && params.inspector) list=list.filter(r=>r.inspector===params.inspector);
  if(params && params.airline) list=list.filter(r=>r.airlineName===params.airline);
  if(params && params.station) list=list.filter(r=>r.aeropuerto===params.station);

  wrap.innerHTML = backBtn() + `
    <div class="toolbar">
      <div class="chip ${flightsFilterType==='all'?'active':''}" data-t="all">TODOS</div>
      <div class="chip ${flightsFilterType==='TURN'?'active':''}" data-t="TURN">TURN</div>
      <div class="chip ${flightsFilterType==='RON-ARRIVAL'?'active':''}" data-t="RON-ARRIVAL">RON LLEGADA</div>
      <div class="chip ${flightsFilterType==='RON-DEPARTURE'?'active':''}" data-t="RON-DEPARTURE">RON SALIDA</div>
      <input class="search-in" placeholder="buscar vuelo o aerolínea…" value="${flightsSearch}" id="fsearch">
    </div>
    <div class="board" id="flightsBoard"></div>
  `;
  wrap.querySelectorAll('.chip').forEach(c=>c.addEventListener('click',()=>{ flightsFilterType=c.dataset.t; renderFlightsBoard(list); wrap.querySelectorAll('.chip').forEach(x=>x.classList.remove('active')); c.classList.add('active'); }));
  wrap.querySelector('#fsearch').addEventListener('input',e=>{ flightsSearch=e.target.value; renderFlightsBoard(list); });
  renderFlightsBoard(list);
}
function renderFlightsBoard(list){
  let filtered=list;
  if(flightsFilterType!=='all') filtered=filtered.filter(r=>r.flightType===flightsFilterType);
  if(flightsSearch.trim()){
    const q=flightsSearch.trim().toLowerCase();
    filtered=filtered.filter(r=>((r.airlineName||'')+' '+(r.flightNumber||'')+' '+(r.inspector||'')).toLowerCase().includes(q));
  }
  filtered=[...filtered].sort((a,b)=>parseFlightDate(b)-parseFlightDate(a));
  const board=document.getElementById('flightsBoard');
  if(!filtered.length){ board.innerHTML='<div class="empty-board">SIN VUELOS PARA ESTE FILTRO</div>'; return; }
  board.innerHTML = filtered.map(r=>{
    const done=r.status==='Completado';
    const ts=parseFlightDate(r); const time=ts?new Date(ts).toLocaleString('es-ES',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}):'–';
    const tb= r.flightType==='TURN'?'<span class="badge b-turn">TURN</span>':r.flightType==='RON-ARRIVAL'?'<span class="badge b-arr">RON-ARR</span>':'<span class="badge b-dep">RON-DEP</span>';
    const c=inspColor(r.inspector);
    return `<div class="frow" data-key="${r.flightKey}">
      <div class="frow-flight"><span class="code">${r.airline||'–'}</span>${r.airlineName||'–'} ${r.flightNumber||'–'}</div>
      <div class="frow-insp"><span class="dot-insp" style="background:${c}"></span>${r.inspector||'–'}</div>
      <div>${tb}</div>
      <div class="prog-wrap"><div class="prog-bg"><div class="prog-fill ${done?'done':''}" style="width:${Math.round(r.progress||0)}%"></div></div><span class="prog-pct">${Math.round(r.progress||0)}%</span></div>
      <div class="frow-time">${time}</div>
    </div>`;
  }).join('');
  board.querySelectorAll('.frow').forEach(el=> el.addEventListener('click',()=> goTo('flight', el.dataset.key.split('_').slice(1).join('_')||'Vuelo', {key:el.dataset.key}) ));
}

/* ══ ALERTAS ══ */
function renderAlerts(wrap,alerts){
  wrap.innerHTML = backBtn() + `
    <div class="tiles4" style="grid-template-columns:1fr 1fr;margin-bottom:18px;">
      <div class="flap tile c-red" style="cursor:default"><div class="tile-num">${alerts.filter(a=>a.type==='critical').length}</div><div class="tile-label">Críticas</div></div>
      <div class="flap tile c-amber" style="cursor:default"><div class="tile-num">${alerts.filter(a=>a.type==='warning').length}</div><div class="tile-label">Advertencias</div></div>
    </div>
    <div class="board" id="alertBoard"></div>
  `;
  const board=wrap.querySelector('#alertBoard');
  if(!alerts.length){ board.innerHTML='<div class="empty-board">✅ SIN ALERTAS ACTIVAS</div>'; return; }
  board.innerHTML = alerts.map((a,i)=>`<div class="arow ${a.type==='critical'?'crit':'warn'}" data-i="${i}">
    <div class="aic">${a.icon}</div>
    <div class="abody"><div class="atitle">${a.title}</div><div class="adesc">${a.desc}</div></div>
    <div class="aval ${a.type==='critical'?'crit':'warn'}">${a.value}${a.unit==='min'?'m':''}</div>
  </div>`).join('');
  board.querySelectorAll('.arow').forEach(el=> el.addEventListener('click',()=>{
    const a=alerts[+el.dataset.i]; goTo('flight',flightLabel(a.report),{key:a.report.flightKey});
  }));
}

/* ══ EQUIPO ══ */
function renderTeam(wrap,reports){
  const map={}; reports.forEach(r=>{ const n=r.inspector||'–'; if(!map[n]) map[n]={name:n,total:0,done:0}; map[n].total++; if(r.status==='Completado') map[n].done++; });
  const list=Object.values(map).map(s=>({...s,pct:s.total?Math.round(s.done/s.total*100):0})).sort((a,b)=>b.total-a.total);
  wrap.innerHTML = backBtn() + '<div class="board" id="teamBoard"></div>';
  const board=wrap.querySelector('#teamBoard');
  if(!list.length){ board.innerHTML='<div class="empty-board">SIN DATOS EN ESTE PERÍODO</div>'; return; }
  const max=list[0].total||1;
  board.innerHTML=list.map((s,i)=>{
    const c=inspColor(s.name);
    const pos=i===0?'p1':i===1?'p2':i===2?'p3':'';
    return `<div class="rrow" data-name="${s.name}">
      <div class="rpos ${pos}">${i+1}</div>
      <div class="rname">${s.name}</div>
      <div class="rmeta">${s.pct}% ✓</div>
      <div class="rbar-wrap"><div class="rbar-bg"><div class="rbar-fill" style="width:${Math.round(s.total/max*100)}%;background:${c}"></div></div></div>
      <div class="rval" style="color:${c}">${s.total}</div>
    </div>`;
  }).join('');
  board.querySelectorAll('.rrow').forEach(el=> el.addEventListener('click',()=> goTo('entity-flights', el.dataset.name, {inspector:el.dataset.name}) ));
}

/* ══ AEROLÍNEAS ══ */
function renderAirlines(wrap,reports){
  const map={}; reports.forEach(r=>{ const n=r.airlineName||r.airline||'–'; if(!map[n]) map[n]={name:n,total:0,done:0}; map[n].total++; if(r.status==='Completado') map[n].done++; });
  const list=Object.values(map).map(s=>({...s,pct:s.total?Math.round(s.done/s.total*100):0})).sort((a,b)=>b.total-a.total);
  wrap.innerHTML = backBtn() + '<div class="board" id="airBoard"></div>';
  const board=wrap.querySelector('#airBoard');
  if(!list.length){ board.innerHTML='<div class="empty-board">SIN DATOS EN ESTE PERÍODO</div>'; return; }

  board.innerHTML=list.map((s,i)=>{
    const pos=i===0?'p1':i===1?'p2':i===2?'p3':'';
    const barColor=s.pct>=80?'var(--nav-green)':s.pct>=60?'var(--amber)':'var(--beacon-red)';
    return `<div class="rrow" data-name="${s.name}">

/* ══ ESTACIONES ══ */
function renderStations(wrap,reports){
  const map={}; reports.forEach(r=>{ const n=r.aeropuerto||'–'; if(!map[n]) map[n]={name:n,total:0,done:0}; map[n].total++; if(r.status==='Completado') map[n].done++; });

/* ══ TENDENCIA (carga histórico completo bajo demanda) ══ */
function renderTrend(wrap){
  wrap.innerHTML = backBtn() + '<div class="spark-wrap"><div class="empty-board" style="border:none;background:none;">SINCRONIZANDO HISTÓRICO…</div></div>';
  ensureData('all', ()=>{
    const days=14, now=new Date(), buckets={};
    for(let i=days-1;i>=0;i--){ const d=new Date(now); d.setDate(d.getDate()-i); buckets[d.toISOString().slice(0,10)]={total:0,done:0}; }
    allCached().forEach(r=>{
      const ts=parseFlightDate(r); if(!ts) return;
      const k=new Date(ts).toISOString().slice(0,10);
      if(buckets[k]){ buckets[k].total++; if(r.status==='Completado') buckets[k].done++; }
    });
    const keys=Object.keys(buckets);
    const max=Math.max(...keys.map(k=>buckets[k].total),1);
    const W=680,H=110,barW=(W/days)*0.62,gap=(W/days);
    let bars='';
    keys.forEach((k,i)=>{
      const v=buckets[k].total, h=Math.max(2,(v/max)*(H-8)), x=i*gap+(gap-barW)/2, y=H-h;
      const pctDone= v? buckets[k].done/v : 0;
      const color = pctDone>=0.8 ? 'var(--nav-green)' : pctDone>=0.5 ? 'var(--amber)' : v>0 ? 'var(--beacon-red)' : 'rgba(255,255,255,0.08)';
      bars += `<rect class="spark-bar" data-k="${k}" x="${x}" y="${y}" width="${barW}" height="${h}" rx="2" fill="${color}"></rect>`;
    });
    const labels = keys.map((k,i)=> i%2===0 ? new Date(k+'T12:00:00').toLocaleDateString('es-ES',{day:'2-digit',month:'short'}) : '').join('||');
    wrap.innerHTML = backBtn() + `
      <div class="hero-eyebrow" style="margin-bottom:10px;">ÚLTIMOS 14 DÍAS</div>
      <div class="spark-wrap">
        <svg class="spark-svg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">${bars}</svg>
        <div class="spark-labels">${labels.split('||').map(l=>`<span>${l}</span>`).join('')}</div>
      </div>
      <div class="section-label">tocá un día para ver sus vuelos</div>
    `;
    wrap.querySelectorAll('.spark-bar').forEach(el=> el.addEventListener('click',()=>{
      const k=el.dataset.k;
      const label=new Date(k+'T12:00:00').toLocaleDateString('es-ES',{day:'2-digit',month:'long'});
      goTo('day',label,{dateKey:k});
    }));
  });
}
function renderDayFlights(wrap,dateKey){
  const list = allCached().filter(r=>{ const ts=parseFlightDate(r); if(!ts) return false; return new Date(ts).toISOString().slice(0,10)===dateKey; });
  renderFlights(wrap, list, {});
}

/* ══ DETALLE DE VUELO ══ */
function renderFlightDetail(wrap,key){
  const r = cache.byKey[key];
  if(!r){ wrap.innerHTML = backBtn() + '<div class="empty-board">VUELO NO ENCONTRADO EN CACHÉ — VOLVÉ Y ACTUALIZÁ</div>'; return; }
  const done = r.status==='Completado';
  const ts=parseFlightDate(r); const dateStr = ts ? new Date(ts).toLocaleString('es-ES',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}) : '–';
  const cps=r.checkpoints||[];
  const beacon=cpTs(r,'Beacon OFF');
  let violations=0;
  const parsed = cps.map(cp=>{
    const sla=SLA_FROM_BEACON[cp.label];
    const m = beacon? minFrom(beacon,cp.timestamp) : null;
    let status='ok';
    if(sla && m!==null){ if(m>sla.crit){status='late';violations++;} else if(m>sla.warn){status='warn';} }
    return {label:cp.label, ts:cp.timestamp, m, sla, status};
  }).filter(cp=>cp.ts);

  wrap.innerHTML = backBtn() + `
    <div class="fd-head">
      <div><div class="fd-title">${flightLabel(r)}</div><div class="fd-meta">${r.aeropuerto||'–'} · ${r.flightType||'–'} · ${dateStr}</div></div>
      <div class="fd-status ${done?'done':'live'}">${done?'✓ COMPLETADO':'● EN PROCESO'}</div>
    </div>
    <div class="fd-kpis">
      <div class="flap fd-kpi"><div class="fd-kpi-val" style="color:var(--amber)">${Math.round(r.progress||0)}%</div><div class="fd-kpi-lbl">Avance</div></div>
      <div class="flap fd-kpi"><div class="fd-kpi-val" style="color:var(--sky)">${cps.length}</div><div class="fd-kpi-lbl">Checkpoints</div></div>
      <div class="flap fd-kpi"><div class="fd-kpi-val" style="color:${violations>0?'var(--beacon-red)':'var(--nav-green)'}">${violations}</div><div class="fd-kpi-lbl">Violaciones SLA</div></div>
      <div class="flap fd-kpi"><div class="fd-kpi-val" style="color:var(--ink)">${r.photoCount||0}</div><div class="fd-kpi-lbl">Fotos</div></div>
    </div>

    <div class="insp-strip">
      <div class="insp-av" style="background:${inspColor(r.inspector)}">${initials(r.inspector)}</div>
      <div><div class="insp-name">${r.inspector||'–'}</div><div class="insp-role">Inspector de rampa</div></div>
      <button class="photo-cta" id="photoBtn" ${r.photoCount>0?'':'disabled'}>📸 Ver fotos</button>
    </div>

    <div class="section-label">línea de tiempo</div>
    <div class="timeline" id="tlWrap"></div>
  `;
  const tlWrap = wrap.querySelector('#tlWrap');
  if(!parsed.length){ tlWrap.innerHTML='<div class="empty-board">SIN CHECKPOINTS REGISTRADOS</div>'; }
  else{
    tlWrap.innerHTML = parsed.map(cp=>{
      const meta=cp.sla;
      const deltaTxt = cp.m!==null ? '+'+cp.m+'m' : '';
      return `<div class="tl-item"><div class="tl-line"></div><div class="tl-dot ${cp.status}"></div>
        <div class="tl-body"><div class="tl-name">${meta?meta.icon+' '+meta.label:cp.label}</div>
        <div class="tl-time">${(String(cp.ts).match(/\d{1,2}:\d{2}/)||[cp.ts])[0]}</div>
        ${deltaTxt?`<div class="tl-delta ${cp.status}">${deltaTxt}</div>`:''}</div></div>`;
    }).join('');
  }
  const pb=wrap.querySelector('#photoBtn');
  if(pb) pb.addEventListener('click',()=> openLightbox(r));
}
function initials(name){ if(!name) return '?'; const p=name.split(/[\s@._-]/); return ((p[0]?.[0]||'?')+(p[1]?.[0]||name[1]||'')).toUpperCase(); }

/* ══════════════════════════════════════════════════════════
   LIGHTBOX DE FOTOS
   ══════════════════════════════════════════════════════════ */
var lbxPhotos=[], lbxIdx=0;
function openLightbox(report){
  const embedded=(report.checkpoints||[]).filter(cp=>cp.photoUrl||cp.thumbUrl);
  document.getElementById('lbx').classList.remove('hidden');
  document.body.style.overflow='hidden';
  document.getElementById('lbxBadge').textContent='✈️ '+flightLabel(report);
  document.getElementById('lbxTitle').textContent='Galería de checkpoints';
  document.getElementById('lbxSub').textContent=(report.inspector||'–')+' · '+(report.aeropuerto||'–');
  if(embedded.length){
    lbxPhotos = embedded.map(cp=>({label:cp.label,timestamp:cp.timestamp,photoUrl:cp.photoUrl,thumbUrl:cp.thumbUrl||cp.photoUrl}));
    lbxRender();
  } else {
    document.getElementById('lbxCount').textContent='cargando…';
    const url = SCRIPT_URL+'?action=getFlightPhotos&flightKey='+encodeURIComponent(report.flightKeyRaw||report.flightKey);
    jsonpFetch('jst_lbx_'+Date.now(),url,8000,
      data=>{ if(data&&data.success&&Array.isArray(data.photos)&&data.photos.length){ lbxPhotos=data.photos; } else { lbxPhotos=[]; } lbxRender(); },
      ()=>{ lbxPhotos=[]; lbxRender(); });
  }
}
function lbxRender(){
  const total=lbxPhotos.length;
  document.getElementById('lbxCount').textContent=total+' foto'+(total!==1?'s':'');
  document.getElementById('lbxStrip').innerHTML = lbxPhotos.map((p,i)=>{
    const has=!!(p.photoUrl||p.thumbUrl);
    return `<div class="lbx-thumb ${i===0?'active':''}" data-i="${i}">${has?`<img src="${p.thumbUrl||p.photoUrl}" loading="lazy" onerror="this.parentElement.innerHTML='<div class=lbx-noph>📷</div>'">`:'<div class="lbx-noph">📷</div>'}<div class="tlabel">${p.label||'–'}</div></div>`;
  }).join('');
  document.querySelectorAll('.lbx-thumb').forEach(el=> el.addEventListener('click',()=> lbxShow(+el.dataset.i)));
  lbxIdx=0; lbxShow(0);
}
function lbxShow(i){
  if(!lbxPhotos.length){ document.getElementById('lbxImg').style.display='none'; document.getElementById('lbxNo').style.display='block'; document.getElementById('lbxCap').textContent=''; return; }
  i=Math.max(0,Math.min(i,lbxPhotos.length-1)); lbxIdx=i;
  document.querySelectorAll('.lbx-thumb').forEach((el,idx)=>el.classList.toggle('active',idx===i));
  document.getElementById('lbxPrev').disabled=i===0;
  document.getElementById('lbxNext').disabled=i===lbxPhotos.length-1;
  const p=lbxPhotos[i];
  const img=document.getElementById('lbxImg'), no=document.getElementById('lbxNo'), spin=document.getElementById('lbxSpin');
  if(p.photoUrl||p.thumbUrl){
    img.style.display='none'; no.style.display='none'; spin.style.display='block';
    let src=p.thumbUrl||p.photoUrl;
    const m=String(p.photoUrl||'').match(/\/d\/([a-zA-Z0-9_-]{10,})/) || String(p.photoUrl||'').match(/[?&]id=([a-zA-Z0-9_-]{10,})/);
    if(m) src='https://drive.google.com/thumbnail?id='+m[1]+'&sz=w1200';
    img.src=src;
  } else { spin.style.display='none'; img.style.display='none'; no.style.display='block'; }
  document.getElementById('lbxCap').textContent=(p.label||'–')+(p.timestamp?' · '+p.timestamp:'');
}
function lbxLoaded(){ document.getElementById('lbxSpin').style.display='none'; document.getElementById('lbxImg').style.display='block'; }
function lbxErr(){ document.getElementById('lbxSpin').style.display='none'; document.getElementById('lbxImg').style.display='none'; document.getElementById('lbxNo').style.display='block'; }
function lbxNav(d){ lbxShow(lbxIdx+d); }
function closeLbx(){ document.getElementById('lbx').classList.add('hidden'); document.body.style.overflow=''; }
document.addEventListener('keydown',e=>{
  if(e.key==='Escape') closeLbx();
  const lbxOpen=!document.getElementById('lbx').classList.contains('hidden');
  if(lbxOpen && e.key==='ArrowLeft') lbxNav(-1);
  if(lbxOpen && e.key==='ArrowRight') lbxNav(1);
});

function tickClock(){ document.getElementById('clock').textContent = new Date().toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit',second:'2-digit'}); }

(function boot(){
  const hadCache = Object.keys(cache.byKey).length>0;
